[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gcvae"
version = "0.2.0"
description = "Guided Clustering Variational AutoEncoder (GCVAE) in PyTorch"
readme = "README.md"
license = "MIT"
authors = [{ name = "Violaine Courrier" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.0",
]

[project.optional-dependencies]
# MNIST-SVHN experiment: data loader, train.py, search.py, evaluate.py
mnist = ["torchvision>=0.15", "PyYAML>=6.0"]
# Bayesian hyperparameter search (e.g. Optuna), as in the examples
search = ["optuna>=4.0"]
# Plots in the examples
examples = ["matplotlib>=3.7"]
dev = ["pytest>=7", "nbstripout>=0.6"]

[project.urls]
Repository = "https://github.com/vcourrier/gcvae"

[tool.setuptools]
packages = ["gcvae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
